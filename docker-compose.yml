version: "3.9"

services:
  db:
    image: postgres:16
    container_name: leadforge-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leadforge

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: leadforge-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: leadforge-backend

    depends_on:
      - db
      - redis

    ports:
      - "8000:8000"

volumes:
  postgres_data: